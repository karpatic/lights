<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lights Notebook Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <script type="application/json" id="route-map">
      [
        { "path": "/", "notebook": "./ipynb/index.ipynb", "label": "Lights" },
        { "path": "/lights.html", "notebook": "./ipynb/lights.ipynb", "label": "LEDs" },
        { "path": "/audio.html", "notebook": "./ipynb/audio.ipynb", "label": "Sound" },
        { "path": "/web.html", "notebook": "./ipynb/web.ipynb", "label": "Web" },
        { "path": "/upload.html", "notebook": "./ipynb/upload.ipynb", "label": "Upload" },
        { "path": "/wled.html", "notebook": "./ipynb/wled.ipynb", "label": "WLED" },
        { "path": "/esp32.html", "notebook": "./ipynb/esp32.ipynb", "label": "ESP32" },
        { "path": "/plan.html", "notebook": "./ipynb/plan.ipynb", "label": "Plan" },
        { "path": "/board_designs.html", "notebook": "./ipynb/board_design.ipynb", "label": "Board Designs" },
        { "path": "/diagrams.html", "notebook": "./ipynb/diagrams.ipynb", "label": "Diagrams" },
        { "path": "/licensing.html", "notebook": "./ipynb/licensing.ipynb", "label": "Licensing" }
      ]
    </script>
    <script type="application/json" id="route-aliases">
      {
        "/index.html": "/",
        "/hardware.html": "/board_designs.html",
        "/firmware.html": "/esp32.html",
        "/browser.html": "/web.html",
        "/flashing.html": "/upload.html",
        "/leds.html": "/lights.html",
        "/next-steps.html": "/plan.html",
        "/architecture.html": "/diagrams.html",
        "/compliance.html": "/licensing.html"
      }
    </script>
    <div class="nav-shell" id="navShell">
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="mainNav">
        Menu
      </button>
      <nav class="main-nav" id="mainNav" aria-label="Notebook navigation"></nav>
    </div>
    <div id="content"></div>
    <script type="module">
      import ipynb2web from 'https://cdn.jsdelivr.net/npm/ipynb2web@latest/dist/ipynb2web.browser.mjs';

      const routeMap = JSON.parse(document.getElementById('route-map').textContent);
      const routeAliases = JSON.parse(document.getElementById('route-aliases').textContent);
      const routesByPath = new Map(routeMap.map((route) => [route.path, route]));

      function normalizeRoutePath(path) {
        if (!path || path === '#') {
          return '/';
        }

        let normalized = path.trim();
        if (normalized.startsWith('#')) {
          normalized = normalized.slice(1);
        }

        if (!normalized || normalized === '/') {
          return '/';
        }

        if (!normalized.startsWith('/')) {
          normalized = `/${normalized}`;
        }

        if (!normalized.includes('.')) {
          normalized = `${normalized}.html`;
        }

        return routeAliases[normalized] || normalized;
      }

      function routeHash(path) {
        return path === '/' ? '#/' : `#${path.replace(/\.html$/, '')}`;
      }

      function pageNameFor(path) {
        if (path === '/') {
          return 'Lights';
        }

        const route = routesByPath.get(path);
        return route?.label || path.replace(/^\//, '').replace(/\.html$/, '');
      }

      function notebookMarkdown(notebook) {
        return (notebook.cells || [])
          .filter((cell) => cell.cell_type === 'markdown')
          .flatMap((cell) => Array.isArray(cell.source) ? cell.source : [cell.source || ''])
          .join('');
      }

      function titleFromMarkdown(markdown, fallbackTitle) {
        const match = markdown.match(/^#\s+(.+)$/m);
        return match ? match[1].trim() : fallbackTitle;
      }

      function stripNotebookTitle(markdown) {
        return markdown
          .replace(/^#\s+.+\n+/, '')
          .replace(/^>\s+.+\n+/, '')
          .replace(/^\s*-\s+keywords:\s*\[[^\n]+\]\n+/m, '')
          .trimStart();
      }

      function getPathFromHash() {
        return normalizeRoutePath(window.location.hash || '#/');
      }

      function routeFromPath(path) {
        const normalized = normalizeRoutePath(path);
        const route = routesByPath.get(normalized);
        return route ? { ...route, path: normalized } : null;
      }

      function renderNav() {
        const nav = document.getElementById('mainNav');
        const list = document.createElement('ul');

        routeMap.forEach((route) => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = routeHash(route.path);
          link.textContent = route.label;
          link.dataset.route = route.path;
          item.appendChild(link);
          list.appendChild(item);
        });

        nav.replaceChildren(list);
      }

      function setMobileNavOpen(open) {
        const shell = document.getElementById('navShell');
        const toggle = document.getElementById('navToggle');
        shell.classList.toggle('nav-open', open);
        toggle.setAttribute('aria-expanded', String(open));
      }

      function bindMobileNav() {
        const nav = document.getElementById('mainNav');
        const toggle = document.getElementById('navToggle');

        toggle.addEventListener('click', () => {
          setMobileNavOpen(toggle.getAttribute('aria-expanded') !== 'true');
        });

        nav.addEventListener('click', (event) => {
          if (event.target.closest('a') && window.matchMedia('(max-width: 768px)').matches) {
            setMobileNavOpen(false);
          }
        });
      }

      function executeScripts(element) {
        const scripts = element.querySelectorAll('script');
        scripts.forEach((oldScript) => {
          const newScript = document.createElement('script');

          Array.from(oldScript.attributes).forEach((attr) => {
            newScript.setAttribute(attr.name, attr.value);
          });

          newScript.textContent = oldScript.textContent;
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      }

      async function loadNotebook(route) {
        const contentDiv = document.getElementById('content');
        contentDiv.innerHTML = '<div class="loading">Loading notebook...</div>';

        try {
          const meta = await ipynb2web.nb2json(route.notebook);
          console.log('Loaded notebook:', route.notebook, meta);

          let notebookBody = meta.content || '';
          let markdownTitle = '';
          if (!notebookBody) {
            const response = await fetch(route.notebook);
            if (!response.ok) {
              throw new Error(`Unable to fetch notebook JSON (${response.status})`);
            }
            const notebook = await response.json();
            const markdown = notebookMarkdown(notebook);
            markdownTitle = titleFromMarkdown(markdown, route.label || 'Notebook');
            notebookBody = marked.parse(stripNotebookTitle(markdown));
          }

          const metaInfo = meta?.meta || {};
          const fallbackTitle = route.label || 'Notebook';
          const pageTitle = markdownTitle || (metaInfo.title && !metaInfo.title.startsWith('#') ? metaInfo.title : fallbackTitle);
          const description = metaInfo.summary || '';
          const breadcrumb = route.path === '/'
            ? '<div class="breadcrumb">Lights</div>'
            : `<div class="breadcrumb"><a href="#/">Lights</a> &raquo; ${pageNameFor(route.path)}</div>`;

          const headerHTML = `
            <div class="page-header">
              ${breadcrumb}
              <h1>${pageTitle}</h1>
              ${description ? `<p class="description">${description}</p>` : ''}
            </div>
          `;

          contentDiv.innerHTML = headerHTML + notebookBody;
          document.title = `${pageNameFor(route.path)} - Lights`;
          document.body.dataset.currentNotebook = route.path;
          executeScripts(contentDiv);
        } catch (error) {
          console.error('Error loading notebook:', error);
          contentDiv.innerHTML = `<div class="error">Error loading notebook: ${route.notebook}<br>${error.message}</div>`;
        }
      }

      function showRouteNotFound(path) {
        const contentDiv = document.getElementById('content');
        contentDiv.innerHTML = `
            <div class="page-header">
            <div class="breadcrumb"><a href="#/">Lights</a></div>
            <h1>Route Not Found</h1>
            <p class="description">This page is not part of the current Lights site.</p>
          </div>
          <p>The requested route <code>${path}</code> is not active. Check <a href="#/">Lights</a> for current navigation.</p>
        `;
      }

      function setActiveNav(path) {
        document.querySelectorAll('.main-nav a').forEach((link) => {
          link.classList.toggle('active', link.dataset.route === path);
        });
      }

      function navigateToPath(path, updateHistory = true) {
        const route = routeFromPath(path);
        const normalizedPath = normalizeRoutePath(path);

        if (!route) {
          showRouteNotFound(normalizedPath);
          return false;
        }

        if (updateHistory && window.location.hash !== routeHash(route.path)) {
          window.history.pushState({ path: route.path }, '', routeHash(route.path));
        }

        setActiveNav(route.path);
        loadNotebook(route);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return true;
      }

      function pathFromLink(link) {
        const href = link.getAttribute('href');
        if (!href) {
          return null;
        }

        if (href.startsWith('#')) {
          return normalizeRoutePath(href);
        }

        if (href.startsWith('/')) {
          return normalizeRoutePath(href);
        }

        return null;
      }

      function interceptLinks() {
        document.addEventListener('click', (event) => {
          const link = event.target.closest('a');
          if (!link) {
            return;
          }

          const path = pathFromLink(link);
          if (!path || !routeFromPath(path)) {
            return;
          }

          event.preventDefault();
          navigateToPath(path);
        });
      }

      window.addEventListener('popstate', (event) => {
        const path = event.state?.path || getPathFromHash();
        navigateToPath(path, false);
      });

      window.addEventListener('hashchange', () => {
        const path = getPathFromHash();
        if (document.body.dataset.currentNotebook !== normalizeRoutePath(path)) {
          navigateToPath(path, false);
        }
      });

      function loadInitialContent() {
        const path = getPathFromHash();
        window.history.replaceState({ path: normalizeRoutePath(path) }, '', window.location.hash || '#/');
        navigateToPath(path, false);
      }

      renderNav();
      bindMobileNav();
      interceptLinks();
      loadInitialContent();
    </script>
  </body>
</html>
